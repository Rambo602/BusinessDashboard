name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: bz-${{ hashFiles('buildozer.spec') }}
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev libltdl-dev
      - name: Prepare patched python-for-android
        run: |
          set -e
          BR=$(grep ^p4a.branch buildozer.spec | head -n1 | cut -d= -f2 | tr -d " ")
          BR=${BR:-master}
          git clone --depth 1 -b "$BR" https://github.com/kivy/python-for-android p4a-src
          python3 ci_patch_manifest.py
      - name: Build
        run: pip install buildozer cython==0.29.37 && buildozer -v android debug
      - name: Re-sign APK with permanent key
        run: |
          set -e
          KS=$HOME/.android/debug.keystore
          keytool -list -keystore $KS -storepass android | grep -q 'F8:34:B8:F4' || { echo WRONG-KEYSTORE-IN-SECRET; keytool -list -keystore $KS -storepass android | grep SHA256; exit 1; }
          AS=$(find $HOME/.buildozer -type f -name apksigner -path '*build-tools*' | sort | tail -1)
          echo using $AS
          for f in bin/*.apk; do $AS sign --ks $KS --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey $f; $AS verify --print-certs $f | grep SHA-256; done
      - name: Verify service is in APK
        run: |
          AAPT=$(find $HOME/.buildozer -type f -name aapt -path '*build-tools*' | sort | tail -1)
          [ -n "$AAPT" ] || { echo "no aapt found, skipping check"; exit 0; }
          for f in bin/*.apk; do $AAPT dump xmltree $f AndroidManifest.xml | grep -q RamboAccService || { echo SERVICE-MISSING-IN-APK; exit 1; }; done
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
